<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#73152a">
<title>S MUSIC • Admin Panel</title>
<link rel="stylesheet" href="./style.css">

<style>
.admin-page{
max-width:1100px;
margin:auto;
padding:45px 18px 100px;
}

.admin-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
margin-bottom:30px;
}

.admin-header h1{
margin:0;
font-size:clamp(32px,5vw,52px);
letter-spacing:-3px;
}

.admin-card{
background:#ffffffdd;
border:1px solid var(--line);
border-radius:24px;
padding:28px;
margin-bottom:20px;
box-shadow:0 18px 55px #4c10260c;
}

.admin-card h2{
margin-top:0;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.field{
margin-bottom:15px;
}

.field label{
display:block;
margin-bottom:7px;
font-size:10px;
font-weight:900;
letter-spacing:1px;
color:var(--m);
}

.field input,
.field textarea,
.field select{
width:100%;
padding:13px 14px;
border:1px solid #dfcbd0;
border-radius:12px;
outline:none;
font:inherit;
background:#fff;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
border-color:var(--m);
box-shadow:0 0 0 3px #73152a12;
}

.field textarea{
min-height:100px;
resize:vertical;
}

.admin-buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.message{
padding:12px 15px;
margin-top:15px;
border-radius:12px;
background:#f4e5e8;
font-size:12px;
line-height:1.6;
}

.hidden{
display:none!important;
}

.song-manager{
display:grid;
gap:12px;
}

.admin-song{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
padding:16px;
border:1px solid var(--line);
border-radius:16px;
background:white;
}

.admin-song-info{
min-width:0;
}

.admin-song-info strong{
display:block;
font-size:16px;
}

.admin-song-info small{
display:block;
margin-top:5px;
color:var(--muted);
font-size:10px;
}

.song-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.edit-box{
margin-top:12px;
padding:20px;
border-radius:18px;
background:#fff8f6;
border:1px solid var(--line);
}

.upload-box{
padding:18px;
border:1px dashed #bd8d98;
border-radius:15px;
background:#fff;
margin-bottom:15px;
}

.upload-box strong{
display:block;
margin-bottom:5px;
}

.upload-box small{
color:var(--muted);
font-size:10px;
}

input[type=file]{
padding:10px;
}

.preview{
width:90px;
height:90px;
object-fit:cover;
border-radius:14px;
border:1px solid var(--line);
margin-top:10px;
}

@media(max-width:650px){

.grid2{
grid-template-columns:1fr;
}

.admin-header{
align-items:flex-start;
flex-direction:column;
}

.admin-song{
align-items:flex-start;
flex-direction:column;
}

.song-actions{
width:100%;
}

.song-actions .btn{
flex:1;
}

}
</style>
</head>

<body>

<div class="grain"></div>

<div class="admin-page">

<div class="admin-header">

<div>
<p class="eyebrow">S MUSIC OFFICIAL</p>
<h1>Admin Panel</h1>
</div>

<a href="./index.html" class="btn ghost">
← Website
</a>

</div>


<!-- SECURITY -->

<section class="admin-card" id="pinCard">

<h2>🔐 Admin Security</h2>

<p>
Set your private 6-digit PIN once.
</p>

<div id="registerBox">

<div class="field">
<label>CREATE 6-DIGIT PIN</label>
<input
id="newPin"
type="password"
inputmode="numeric"
maxlength="6"
placeholder="••••••">
</div>

<div class="field">
<label>CONFIRM PIN</label>
<input
id="confirmPin"
type="password"
inputmode="numeric"
maxlength="6"
placeholder="••••••">
</div>

<button
class="btn primary"
id="registerBtn">
Register PIN
</button>

</div>


<div id="loginBox" class="hidden">

<div class="field">
<label>ADMIN PIN</label>
<input
id="loginPin"
type="password"
inputmode="numeric"
maxlength="6"
placeholder="••••••">
</div>

<div class="admin-buttons">

<button
class="btn primary"
id="loginBtn">
Unlock Admin
</button>

<button
class="btn ghost"
id="forgotBtn">
Forgot PIN?
</button>

</div>

</div>

<div class="message" id="pinMessage"></div>

</section>


<!-- DASHBOARD -->

<section class="admin-card hidden" id="dashboard">

<h2>🎵 Release Manager</h2>

<p>
Add a new song or update an existing release.
</p>

<button
class="btn ghost"
id="logoutBtn">
🔒 Lock Admin
</button>

<hr>


<h2 id="formHeading">
Add New Release
</h2>


<div class="grid2">

<div class="field">

<label>SONG TITLE</label>

<input
id="songTitle"
placeholder="Song title">

</div>


<div class="field">

<label>ARTIST</label>

<input
id="songArtist"
value="AB ROCKERZ">

</div>


<div class="field">

<label>CATEGORY</label>

<select id="songCategory">

<option value="album">
OUR ALBUM SONGS
</option>

<option value="film">
FILM SONGS
</option>

</select>

</div>


<div class="field">

<label>ALBUM / LABEL</label>

<input
id="songAlbum"
placeholder="5th Album / Film Song">

</div>


<div class="field">

<label>RELEASE DATE</label>

<input
id="songDate"
type="date">

</div>


<div class="field">

<label>RELEASE TIME</label>

<input
id="songTime"
type="time"
value="16:00">

</div>

</div>


<div class="field">

<label>YOUTUBE LINK</label>

<input
id="songYoutube"
placeholder="https://youtu.be/...">

</div>


<div class="upload-box">

<strong>🎵 MP3 FILE</strong>

<small>
Select an MP3 from your phone.
</small>

<br><br>

<input
id="songFile"
type="file"
accept=".mp3,audio/mpeg">

</div>


<div class="field">

<label>MP3 URL — OPTIONAL</label>

<input
id="songMp3"
placeholder="Existing MP3 URL">

</div>


<div class="field">

<label>COVER IMAGE URL</label>

<input
id="songCover"
placeholder="Image URL">

</div>


<div class="admin-buttons">

<button
class="btn primary"
id="saveSongBtn">
💾 Save Release
</button>

<button
class="btn ghost hidden"
id="cancelEditBtn">
Cancel Edit
</button>

</div>


<div
class="message"
id="songMessage">
</div>

</section>


<!-- EXISTING SONGS -->

<section
class="admin-card hidden"
id="songManager">

<h2>
📚 Existing Songs
</h2>

<p>
Edit any uploaded song below.
</p>

<div
id="adminSongs"
class="song-manager">
</div>

</section>


<!-- WEBSITE DETAILS -->

<section
class="admin-card hidden"
id="settingsPanel">

<h2>
⚙️ Website Details
</h2>


<div class="field">

<label>YOUTUBE CHANNEL</label>

<input
id="setYoutube">

</div>


<div class="field">

<label>EMAIL</label>

<input
id="setEmail">

</div>


<div class="field">

<label>WHATSAPP</label>

<input
id="setWhatsapp">

</div>


<div class="field">

<label>WEBSITE URL</label>

<input
id="setWebsite">

</div>


<div class="field">

<label>ABOUT S MUSIC</label>

<textarea id="setAbout"></textarea>

</div>


<button
class="btn primary"
id="saveSettings">
💾 Save Website Details
</button>

</section>

</div>


<script>

/* ==========================================
   S MUSIC ADMIN
========================================== */

const PIN_KEY = "s_music_admin_pin";
const DATA_KEY = "s_music_site_data";

let editingId = null;


/* ==========================================
   DEFAULT DATA
========================================== */

const defaultData = {

songs:[

{
id:"bad-ah-mah",
title:"BAD'AH MAH",
artist:"AB ROCKERZ",
category:"album",
albumLabel:"1st Album",
releaseDate:"2026-05-01",
releaseTime:"00:00",
youtube:"https://youtu.be/rkR66Q2bkyY?si=laBVv5x1llHCzC8a",
mp3:"",
cover:""
},

{
id:"ullaara-vaada",
title:"ULLAARA VAADA",
artist:"AB ROCKERZ",
category:"album",
albumLabel:"3rd Album",
releaseDate:"2026-06-23",
releaseTime:"00:00",
youtube:"https://youtu.be/rxNHABZc4zU?si=ttnijvvJRlbb2D3m",
mp3:"",
cover:""
},

{
id:"marayum-ethirozhi",
title:"MARAYUM ETHIROZHI",
artist:"AB ROCKERZ",
category:"album",
albumLabel:"4th Album",
releaseDate:"2026-09-01",
releaseTime:"16:00",
youtube:"",
mp3:"",
cover:""
},

{
id:"hbd-dangera",
title:"HBD DANGERA (Party Song)",
artist:"AB ROCKERZ",
category:"film",
albumLabel:"Film Song",
releaseDate:"2026-08-14",
releaseTime:"00:00",
youtube:"https://youtu.be/kWqzfwXSKVE?si=-04bB14hrzkYE_dB",
mp3:"",
cover:""
}

],

updates:[],

settings:{

youtubeChannel:
"https://youtube.com/@smusic-official-25",

email:
"darkmusic101012@gmail.com",

whatsapp:
"+94777990902",

websiteUrl:
"https://abnfamily.github.io/s-music-official/",

aboutText:
"S MUSIC OFFICIAL is a home for original music, artists, visual stories and new sounds. Discover releases, stream music, watch official visuals and download available tracks."

}

};


/* ==========================================
   LOAD DATA
========================================== */

let data =
JSON.parse(
localStorage.getItem(DATA_KEY)
||
"null"
);

if(!data){

data =
JSON.parse(
JSON.stringify(defaultData)
);

saveData();

}


/* ==========================================
   HELPERS
========================================== */

function $(id){

return document.getElementById(id);

}


function saveData(){

localStorage.setItem(
DATA_KEY,
JSON.stringify(data)
);

}


function escapeHTML(value){

return String(value ?? "")
.replace(/[&<>"']/g,char=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char]));

}


function showMessage(id,text){

$(id).textContent =
text;

}


/* ==========================================
   PIN
========================================== */

function checkPin(){

const pin =
localStorage.getItem(PIN_KEY);

if(pin){

$("registerBox")
.classList.add("hidden");

$("loginBox")
.classList.remove("hidden");

}else{

$("registerBox")
.classList.remove("hidden");

$("loginBox")
.classList.add("hidden");

}

}


$("registerBtn").onclick=()=>{

const pin =
$("newPin").value.trim();

const confirm =
$("confirmPin").value.trim();


if(!/^\d{6}$/.test(pin)){

showMessage(
"pinMessage",
"❌ PIN must contain exactly 6 numbers."
);

return;

}


if(pin!==confirm){

showMessage(
"pinMessage",
"❌ PIN confirmation does not match."
);

return;

}


localStorage.setItem(
PIN_KEY,
pin
);

showMessage(
"pinMessage",
"✅ PIN registered successfully."
);

checkPin();

};


$("loginBtn").onclick=()=>{

const entered =
$("loginPin").value;

const saved =
localStorage.getItem(PIN_KEY);


if(entered===saved){

unlockAdmin();

}else{

showMessage(
"pinMessage",
"❌ Incorrect PIN."
);

}

};


$("forgotBtn").onclick=()=>{

showMessage(
"pinMessage",
"Forgot PIN requires the secure backend/email system. GitHub Pages alone cannot safely email your PIN."
);

};


/* ==========================================
   UNLOCK
========================================== */

function unlockAdmin(){

$("pinCard")
.classList.add("hidden");

$("dashboard")
.classList.remove("hidden");

$("songManager")
.classList.remove("hidden");

$("settingsPanel")
.classList.remove("hidden");

loadSettings();

renderSongs();

}


/* ==========================================
   LOGOUT
========================================== */

$("logoutBtn").onclick=()=>{

location.reload();

};


/* ==========================================
   FORM
========================================== */

function resetForm(){

editingId=null;

$("formHeading").textContent =
"Add New Release";

$("songTitle").value="";
$("songArtist").value="AB ROCKERZ";
$("songCategory").value="album";
$("songAlbum").value="";
$("songDate").value="";
$("songTime").value="16:00";
$("songYoutube").value="";
$("songMp3").value="";
$("songCover").value="";
$("songFile").value="";

$("cancelEditBtn")
.classList.add("hidden");

$("saveSongBtn").textContent =
"💾 Save Release";

}


function editSong(id){

const song =
data.songs.find(
item=>item.id===id
);

if(!song)
return;

editingId=id;

$("formHeading").textContent =
"✏️ Edit Release";

$("songTitle").value =
song.title || "";

$("songArtist").value =
song.artist || "";

$("songCategory").value =
song.category || "album";

$("songAlbum").value =
song.albumLabel || "";

$("songDate").value =
song.releaseDate || "";

$("songTime").value =
song.releaseTime || "00:00";

$("songYoutube").value =
song.youtube || "";

$("songMp3").value =
song.mp3 || "";

$("songCover").value =
song.cover || "";

$("songFile").value="";

$("cancelEditBtn")
.classList.remove("hidden");

$("saveSongBtn").textContent =
"💾 Update Release";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* ==========================================
   SAVE / UPDATE SONG
========================================== */

$("saveSongBtn").onclick=async()=>{

const title =
$("songTitle").value.trim();

const date =
$("songDate").value;


if(!title){

showMessage(
"songMessage",
"❌ Song title is required."
);

return;

}


if(!date){

showMessage(
"songMessage",
"❌ Release date is required."
);

return;

}


const selectedFile =
$("songFile").files[0];


/*
 IMPORTANT:
 The selected MP3 is NOT permanently uploaded
 by this frontend alone.

 Once GitHub backend API is connected,
 this file will be sent to the backend.
*/

let mp3Url =
$("songMp3").value.trim();


if(selectedFile){

if(
selectedFile.type!=="audio/mpeg" &&
!selectedFile.name.toLowerCase().endsWith(".mp3")
){

showMessage(
"songMessage",
"❌ Please select an MP3 file."
);

return;

}


/*
 Temporary browser preview.

 Backend upload will replace this
 with the permanent GitHub URL.
*/

mp3Url =
URL.createObjectURL(
selectedFile
);

}


const songData={

title:title,

artist:
$("songArtist").value.trim()
||"AB ROCKERZ",

category:
$("songCategory").value,

albumLabel:
$("songAlbum").value.trim()
||"Release",

releaseDate:date,

releaseTime:
$("songTime").value
||"00:00",

youtube:
$("songYoutube").value.trim(),

mp3:mp3Url,

cover:
$("songCover").value.trim()

};


if(editingId){

const index =
data.songs.findIndex(
song=>song.id===editingId
);

if(index!==-1){

data.songs[index] = {

...data.songs[index],

...songData

};

}

showMessage(
"songMessage",
"✅ Song details updated."
);

}else{

data.songs.push({

id:
Date.now().toString(),

...songData

});

showMessage(
"songMessage",
"✅ New release added."
);

}


saveData();

renderSongs();

setTimeout(
resetForm,
700
);

};


/* ==========================================
   CANCEL EDIT
========================================== */

$("cancelEditBtn").onclick=()=>{

resetForm();

};


/* ==========================================
   RENDER SONGS
========================================== */

function renderSongs(){

const box =
$("adminSongs");


if(!data.songs.length){

box.innerHTML =
"<p>No songs available.</p>";

return;

}


box.innerHTML =
data.songs.map(song=>`

<div class="admin-song">

<div class="admin-song-info">

<strong>
${escapeHTML(song.title)}
</strong>

<small>
${escapeHTML(song.artist)}
•
${escapeHTML(song.category)}
•
${escapeHTML(song.releaseDate)}
</small>

<small>
MP3:
${song.mp3 ? "✅ Added" : "❌ Not added"}
</small>

</div>


<div class="song-actions">

<button
class="btn ghost"
onclick="editSong('${song.id}')">
✏️ Edit
</button>

<button
class="btn ghost"
onclick="deleteSong('${song.id}')">
🗑️ Delete
</button>

</div>

</div>

`).join("");

}


/* ==========================================
   DELETE
========================================== */

function deleteSong(id){

const song =
data.songs.find(
item=>item.id===id
);

if(!song)
return;

if(!confirm(
`Delete "${song.title}"?`
)){

return;

}


data.songs =
data.songs.filter(
item=>item.id!==id
);

saveData();

renderSongs();

}


/* ==========================================
   SETTINGS
========================================== */

function loadSettings(){

const s =
data.settings;

$("setYoutube").value =
s.youtubeChannel || "";

$("setEmail").value =
s.email || "";

$("setWhatsapp").value =
s.whatsapp || "";

$("setWebsite").value =
s.websiteUrl || "";

$("setAbout").value =
s.aboutText || "";

}


$("saveSettings").onclick=()=>{

data.settings.youtubeChannel =
$("setYoutube").value.trim();

data.settings.email =
$("setEmail").value.trim();

data.settings.whatsapp =
$("setWhatsapp").value.trim();

data.settings.websiteUrl =
$("setWebsite").value.trim();

data.settings.aboutText =
$("setAbout").value.trim();

saveData();

alert(
"✅ Website details saved."
);

};


/* ==========================================
   START
========================================== */

checkPin();

</script>

</body>
  </html>
